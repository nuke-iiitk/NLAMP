name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static export (Expo web)
        run: npx expo export --platform web
        env:
          # Pages hosts the site under the repo sub-path → asset URLs must be
          # prefixed (app.config.js reads EXPO_PUBLIC_BASE_PATH). Derived from
          # the repository name at build time so a repo rename (sih-farmer-queue
          # → NLAMP) can't silently bake a stale prefix into the bundle again:
          # a wrong prefix makes the HTML reference another site's JS/CSS, which
          # 404s (blank page) or serves the old build's styles (wrong UI).
          EXPO_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://kisan-kraya-api.onrender.com' }}
          EXPO_PUBLIC_USE_BACKEND: ${{ vars.EXPO_PUBLIC_USE_BACKEND || 'true' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
